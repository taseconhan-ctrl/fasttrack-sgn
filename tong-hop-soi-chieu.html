<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tổng hợp soi chiếu – Fast Track SGN</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#172033;--muted:#65718a;--line:#dce2ec;--accent:#2257c7;--soft:#eaf0ff;--warn:#946200;--good:#087443}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{background:#14233f;color:#fff;padding:20px max(18px,calc((100% - 1100px)/2))}header h1{margin:0 0 4px;font-size:23px}header p{margin:0;color:#d5def0}
main{max-width:1100px;margin:22px auto;padding:0 16px 60px}.panel,.booking{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #17203308}
textarea{width:100%;min-height:260px;resize:vertical;border:1px solid #bbc6d8;border-radius:10px;padding:13px;font:13px/1.55 ui-monospace,Consolas,monospace}
input{padding:9px 10px;border:1px solid #bbc6d8;border-radius:8px}label{font-weight:650;display:block;margin-bottom:6px}
button,.link{border:0;border-radius:9px;background:var(--accent);color:white;padding:9px 13px;font-weight:650;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-size:14px}
button.secondary,.link.secondary{background:#e9eef7;color:#21304b}.controls,.actions,.topline{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.controls{margin-top:12px}.hint,.muted{color:var(--muted);font-size:13px}.status{padding:11px 13px;border-radius:9px;background:var(--soft);margin-top:12px}.status.good{background:#e8f6ef;color:var(--good)}.status.warn{background:#fff6df;color:var(--warn)}
h2{font-size:19px;margin:0 0 12px}.topline{justify-content:space-between}.booking{margin:0 0 24px;padding:16px 18px}.booking h3{margin:0;font-size:16px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;color:var(--muted);font-size:13px}.names{margin:10px 0 0;padding-left:24px}.names li{padding:2px 0}.terminal-title{margin:24px 0 12px;padding:10px 13px;background:#eaf0ff;border-radius:9px;font-size:18px}.empty{padding:16px;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}.hidden{display:none!important}
@media(max-width:600px){.panel{padding:13px}header h1{font-size:20px}}
</style>
</head>
<body>
<header><h1>TỔNG HỢP SOI CHIẾU</h1><p>Dán tin nhắn yêu cầu hỗ trợ, tự tách booking và lọc theo ngày, Terminal T1/T3.</p></header>
<main>
<section class="panel">
<h2>1. Dán nội dung tin nhắn</h2>
<label for="raw">Dán một hoặc nhiều tin nhắn Zalo/Messenger</label>
<textarea id="raw" placeholder="[25/11/2026 10:17:36] Người gửi:&#10;Tên khách:&#10;1. Nguyen Van A&#10;Chuyến bay: VN1831&#10;Giờ bay: 9.00&#10;Giờ đến sân bay: 7.00&#10;Ghi chú: Hỗ trợ lối nội bộ T3 ngày 26/11"></textarea>
<div class="controls"><button id="analyze">TỔNG HỢP</button><button id="clear" class="secondary">Xóa dữ liệu</button></div>
<p class="hint">Nếu chưa chọn ngày, hệ thống tự lấy ngày hỗ trợ của booking đầu tiên tìm được. Bạn có thể đổi ngày để lọc. Booking thuộc ngày khác sẽ không hiển thị.</p>
<div id="status" class="status">Chưa có dữ liệu.</div>
</section>
<section id="filters" class="panel hidden">
<div class="topline"><div><label for="targetDate">Ngày cần tổng hợp</label><input id="targetDate" type="date"></div><div id="counts" class="hint"></div></div>
<div class="actions" style="margin-top:14px"><button id="copyAll">COPY TẤT CẢ</button><button id="copyT1" class="secondary">COPY T1</button><button id="copyT3" class="secondary">COPY T3</button></div>
</section>
<section id="output" class="hidden"></section>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);
let current={T1:[],T3:[]};
let parsedAll=[];
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function clean(s){return String(s||"").replace(/\r/g,"").trim()}
function dateToISO(d){const m=String(d||"").match(/(\d{1,2})[/-](\d{1,2})[/-](\d{4})/);return m?m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"):""}
function isoToVN(iso){const p=iso.split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:""}
function dateFromBlock(s){
 const m=s.match(/(?:ngày|ngay|ngày bay|ngày hỗ trợ)\s*(?:[:：]\s*)?(\d{1,2})[/-](\d{1,2})(?:[/-](\d{4}))?/i);
 if(!m)return "";
 const stamp=s.match(/^\s*\[(\d{1,2})\/(\d{1,2})\/(\d{4})/);
 const y=m[3]||(stamp&&stamp[3])||String(new Date().getFullYear());
 return y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
}
function field(s,label){
 const re=new RegExp("^\\s*"+label+"\\s*[:：]\\s*(.*)$","im");
 const m=s.match(re);return m?clean(m[1]):"";
}
function terminalOf(s,flight){
 const m=s.match(/(?:terminal|nhà ga)\s*[:：]?\s*T?([13])\b/i)||s.match(/lối nội bộ\s*T?([13])\b/i);
 if(m)return "T"+m[1];
 const f=String(flight||"").replace(/\s/g,"").toUpperCase();
 if(/^VJ/.test(f))return "T1";
 if(/^(VN|QH|BL|VU|0V)/.test(f))return "T3";
 return "";
}
function parseMessage(block,index){
 const stamp=block.match(/^\s*\[(\d{1,2}\/\d{1,2}\/\d{4})\s+\d{2}:\d{2}:\d{2}\]\s*([^:]+):?/m);
 const sender=clean(stamp&&stamp[2]||"");
 const sourceDate=dateFromBlock(block);
 const namesSection=(block.match(/Tên khách\s*[:：]([\s\S]*?)(?=\n\s*(?:Chuyến bay|Giờ bay|Giờ đến sân bay|Terminal|Ghi chú|Yêu cầu|Lối nội bộ)\s*[:：]|$)/i)||[])[1]||"";
 let names=namesSection.split(/\n/).map(x=>clean(x).replace(/^\s*\d+\s*[.)-]\s*/,"").trim()).filter(x=>x&&!/^@/.test(x)&&!/^(?:\d+\.?)?$/.test(x));
 if(!names.length){const one=clean(namesSection);if(one)names=one.split(/[,;；]/).map(clean).filter(Boolean);}
 const flight=field(block,"Chuyến bay").trim();
 const flightTime=field(block,"Giờ bay");
 const arrival=field(block,"Giờ đến sân bay");
 const note=field(block,"Ghi chú")||field(block,"Yêu cầu")||field(block,"Lối nội bộ");
 const explicitTerminal=field(block,"Terminal");
 const terminal=terminalOf("Terminal: "+explicitTerminal+"\n"+note,flight);
 return {index,sender,names,flight,flightTime,arrival,note,serviceDate:sourceDate,terminal,raw:clean(block)};
}
function splitMessages(raw){
 const starts=[...raw.matchAll(/^\s*\[\d{1,2}\/\d{1,2}\/\d{4}\s+\d{2}:\d{2}:\d{2}\]/gm)].map(m=>m.index);
 if(!starts.length)return [raw];
 const out=[];for(let i=0;i<starts.length;i++)out.push(raw.slice(starts[i],starts[i+1]??raw.length));return out;
}
function formatBooking(b){
 const requirement=b.terminal?"yêu cầu lối nội bộ "+b.terminal:"yêu cầu lối nội bộ (chưa xác định Terminal)";
 return [...b.names.map((n,i)=>(i+1)+". "+n),"","Chuyến bay: "+(b.flight||""),"Giờ bay: "+(b.flightTime||""),"Giờ đến sân bay: "+(b.arrival||""),"",requirement].join("\n");
}
async function copyText(value){
 try{await navigator.clipboard.writeText(value);$("status").textContent="Đã sao chép nội dung."; $("status").className="status good"}
 catch(e){const t=document.createElement("textarea");t.value=value;document.body.appendChild(t);t.select();const ok=document.execCommand("copy");t.remove();$("status").textContent=ok?"Đã sao chép nội dung.":"Không sao chép được, vui lòng cấp quyền clipboard."; $("status").className="status "+(ok?"good":"warn")}
}
function card(b,i){
 return '<article class="booking"><div class="topline"><h3>Booking '+(i+1)+' – '+esc(b.flight||"Chưa có chuyến bay")+'</h3><button class="secondary" data-copy="'+b.index+'">COPY BOOKING</button></div><div class="meta"><span>Ngày: '+esc(isoToVN(b.serviceDate))+'</span><span>Giờ bay: '+esc(b.flightTime||"—")+'</span><span>Giờ đến: '+esc(b.arrival||"—")+'</span><span>Người gửi: '+esc(b.sender||"Không rõ")+'</span></div><ol class="names">'+b.names.map(n=>'<li>'+esc(n)+'</li>').join("")+'</ol>'+(b.note?'<p><b>Ghi chú:</b> '+esc(b.note)+'</p>':"")+'</article>';
}
function render(){
 const date=$("targetDate").value;
 current={T1:[],T3:[]};
 parsedAll.forEach(b=>{if(b.serviceDate===date&&b.terminal)current[b.terminal].push(b)});
 const excludedDate=parsedAll.filter(b=>b.serviceDate&&b.serviceDate!==date).length;
 const unknown=parsedAll.filter(b=>b.serviceDate===date&&!b.terminal).length;
 $("counts").textContent="T1: "+current.T1.length+" booking · T3: "+current.T3.length+" booking · Lọc ngày khác: "+excludedDate+(unknown?" · Chưa xác định Terminal: "+unknown:"");
 let html="";
 ["T1","T3"].forEach(t=>{html+='<h2 class="terminal-title">TERMINAL '+t+' ('+current[t].length+' booking)</h2>';html+=current[t].length?current[t].map(card).join(""):'<div class="empty">Không có booking '+t+' trong ngày đã chọn.</div>'});
 $("output").innerHTML=html;$("output").classList.remove("hidden");
 $("copyAll").onclick=()=>copyText(["TERMINAL T1",...current.T1.map(formatBooking),"","TERMINAL T3",...current.T3.map(formatBooking)].join("\n\n"));
 $("copyT1").onclick=()=>copyText(["TERMINAL T1",...current.T1.map(formatBooking)].join("\n\n"));
 $("copyT3").onclick=()=>copyText(["TERMINAL T3",...current.T3.map(formatBooking)].join("\n\n"));
}
$("analyze").addEventListener("click",()=>{
 const raw=clean($("raw").value);if(!raw){$("status").textContent="Bạn chưa dán tin nhắn.";return}
 parsedAll=splitMessages(raw).flatMap((message,i)=>parseMessage(message,i));
 if(!parsedAll.length){$("status").textContent="Không tìm thấy booking phù hợp. Kiểm tra lại định dạng tin nhắn.";return}
 if(!$("targetDate").value){const first=parsedAll.find(b=>b.serviceDate);if(first)$("targetDate").value=first.serviceDate}
 $("filters").classList.remove("hidden");render();
 const missingDate=parsedAll.filter(b=>!b.serviceDate).length;
 $("status").textContent="Đã đọc "+parsedAll.length+" booking. "+(missingDate?"Có "+missingDate+" booking chưa nhận diện được ngày hỗ trợ; các booking này chưa được đưa vào kết quả.":"Đã lọc theo ngày đã chọn.");
 $("status").className="status good";
});
$("targetDate").addEventListener("change",()=>{if(parsedAll.length)render()});
$("clear").addEventListener("click",()=>{$("raw").value="";$("targetDate").value="";$("filters").classList.add("hidden");$("output").classList.add("hidden");$("status").textContent="Đã xóa dữ liệu.";parsedAll=[];current={T1:[],T3:[]}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-copy]");if(!b)return;const item=parsedAll.find(x=>x.index===Number(b.dataset.copy));if(item)copyText(formatBooking(item))});
</script>
</body>
</html>
