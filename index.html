<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10233f">
<title>TA SẼ CỐ | Fast Track SGN</title>
<style>
:root{--navy:#10233f;--blue:#2458bd;--ink:#17243a;--muted:#68758b;--line:#e0e6ef;--paper:#f4f7fb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#dce8ff 0,transparent 48%),var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column}
header{background:var(--navy);color:#fff;padding:22px max(22px,calc((100% - 1080px)/2));box-shadow:0 5px 22px #10233f20}
.brand{font-size:clamp(25px,4vw,36px);font-weight:850;letter-spacing:2px;margin:0}
.sub{margin:3px 0 0;color:#cbd7ea;font-size:14px;letter-spacing:.4px}
main{width:min(100% - 32px,600px);margin:auto;padding:70px 0 80px;flex:1}
.intro{text-align:center;margin-bottom:34px}
.intro h2{font-size:clamp(22px,3vw,30px);margin:0 0 8px}
.intro p{color:var(--muted);margin:0}
.menu{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.item{display:flex;flex-direction:column;min-height:220px;padding:28px;border:1px solid var(--line);border-radius:20px;background:#fff;text-decoration:none;color:inherit;box-shadow:0 12px 35px #1b355b0c;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.item:hover{transform:translateY(-4px);border-color:#a9bee8;box-shadow:0 18px 40px #1b355b18}
.icon{width:52px;height:52px;border-radius:15px;background:#edf3ff;color:var(--blue);display:grid;place-items:center;margin-bottom:20px}
.icon svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.item h3{font-size:21px;margin:0 0 9px;letter-spacing:.3px}
.item p{color:var(--muted);margin:0 0 22px;font-size:14px}
.go{margin-top:auto;color:var(--blue);font-weight:750;font-size:14px}
footer{text-align:center;color:#8490a3;font-size:12px;padding:18px}
@media(max-width:650px){main{padding:45px 0}.item{min-height:195px;padding:23px}}
</style>
</head>
<body>
<header>
  <h1 class="brand">TA SẼ CỐ</h1>
  <p class="sub">FAST TRACK SGN · WORKSPACE</p>
</header>
<main>
  <section class="intro">
    <h2>Chọn chức năng</h2>
    <p>Vui lòng chọn công cụ bạn muốn sử dụng.</p>
  </section>
  <nav class="menu" aria-label="Các chức năng chính">
    <a class="item" href="soan-booking.html">
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg></span>
      <h3>SOẠN BOOKING</h3>
      <p>Phân tích booking, tạo Subject và nội dung tin nhắn, đồng thời tạo các liên kết liên hệ để xử lý nhanh.</p>
      <span class="go">Mở chức năng <span aria-hidden="true">→</span></span>
    </a>
  </nav>
</main>
<footer>TA SẼ CỐ · FAST TRACK SGN</footer>
</body>
</html>
